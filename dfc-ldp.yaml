  "/organizations/{organizationId}/orders/{orderId}/index":
    get:
      summary: Get Order Index
      description: |
        Returns the index document for an order: the relation-level properties the order
        carries in its own right, and references to its order lines.

        dfc-b:Order is a relation rather than an entity, but it is still addressed by its
        own IRI. Four properties are pinned to cardinality 1 in the ontology -- dfc-b:belongsTo,
        dfc-b:orderedBy, dfc-b:selects and dfc-b:uses -- and none of them can live on an
        order line, so they need an identity of their own to be updated
        conditionally.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/orders/order-001/index
                    "@type": dfc-b:Order
                    dfc-b:belongsTo: https://platform.ex/organizations/awesome-farm/sale-sessions/saturday-market/index
                    dfc-b:orderedBy: https://platform.ex/persons/jane-shopper/index
                    dfc-b:selects: https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/standard-delivery
                    dfc-b:uses:
                      "@type": dfc-b:PaymentMethod
                      dfc-b:paymentMethodType: CreditCard
                    dfc-b:hasPart: [https://platform.ex/organizations/awesome-farm/orders/order-001/orderlines/001/index, https://platform.ex/organizations/awesome-farm/orders/order-001/orderlines/002/index]
            text/turtle:
              schema:
                example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-pt: <https://w3id.org/dfc/taxonomies/v2.0.0/productTypes.rdf#> .
                  @prefix dfc-m:  <https://w3id.org/dfc/taxonomies/v2.0.0/measures.rdf#> .
                  <> a dfc-b:Order ;
                      dfc-b:belongsTo <https://platform.ex/organizations/awesome-farm/sale-sessions/saturday-market/index> ;
                      dfc-b:orderedBy <https://platform.ex/persons/jane-shopper/index> ;
                      dfc-b:selects <https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/standard-delivery> ;
                      dfc-b:uses [ a dfc-b:PaymentMethod ;
                                  dfc-b:paymentMethodType "CreditCard" ] ;
                      dfc-b:hasPart <https://platform.ex/organizations/awesome-farm/orders/order-001/orderlines/001/index>,
                                    <https://platform.ex/organizations/awesome-farm/orders/order-001/orderlines/002/index> .
        '404':
          description: order not found
    put:
      summary: Update an Order
      description: |
        Replaces the order at this IRI.

        If a representation already exists this is an update. If none exists the resource is
        created and 201 is returned. This replaces the order's own properties; it does not
        add or remove order lines, which are addressed through the order's orderlines
        container. Send If-Match with the ETag from a prior read to make the write
        conditional.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: >-
          ETag of the current representation. The write fails with 412 if it no
          longer matches, which prevents a lost update.
        schema:
          type: string
      - name: Prefer
        in: header
        required: false
        description: >-
          Response preference. return=minimal omits the response body; the
          status code and headers are unchanged.
        schema:
          type: string
          example: return=representation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#order"
                  "@type": dfc-b:Order
                  dfc-b:belongsTo: https://platform.ex/organizations/awesome-farm/sale-sessions/saturday-market/index
                  dfc-b:orderedBy: https://platform.ex/persons/jane-shopper/index
                  dfc-b:selects: https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/standard-delivery
                  dfc-b:uses:
                    "@type": dfc-b:PaymentMethod
                    dfc-b:paymentMethodType: CreditCard
                  dfc-b:hasPart: ["#line-1", "#line-2"]
                - "@id": "#line-1"
                  "@type": dfc-b:OrderLine
                  dfc-b:concerns: https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/offer-001
                  dfc-b:hasQuantity:
                    "@type": dfc-b:QuantitativeValue
                    dfc-b:hasUnit: dfc-m:Kilogram
                    dfc-b:value: 1.5
                - "@id": "#line-2"
                  "@type": dfc-b:OrderLine
                  dfc-b:concerns: https://platform.ex/organizations/awesome-farm/customer-categories/veg/offers/offer-002
                  dfc-b:hasQuantity:
                    "@type": dfc-b:QuantitativeValue
                    dfc-b:hasUnit: dfc-m:Kilogram
                    dfc-b:value: 2.0
          text/turtle:
            schema:
              example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-pt: <https://w3id.org/dfc/taxonomies/v2.0.0/productTypes.rdf#> .
                  @prefix dfc-m:  <https://w3id.org/dfc/taxonomies/v2.0.0/measures.rdf#> .
                  [] a dfc-b:Order ;
                      dfc-b:belongsTo <https://platform.ex/organizations/awesome-farm/sale-sessions/saturday-market/index> ;
                      dfc-b:orderedBy <https://platform.ex/persons/jane-shopper/index> ;
                      dfc-b:selects <https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/standard-delivery> ;
                      dfc-b:uses [ a dfc-b:PaymentMethod ;
                                  dfc-b:paymentMethodType "CreditCard" ] ;
                      dfc-b:hasPart [ a dfc-b:OrderLine ;
                                     dfc-b:concerns <https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/offer-001> ;
                                     dfc-b:hasQuantity [ a dfc-b:QuantitativeValue ;
                                                         dfc-b:hasUnit dfc-m:Kilogram ;
                                                         dfc-b:value 1.5 ] ],
                                    [ a dfc-b:OrderLine ;
                                     dfc-b:concerns <https://platform.ex/organizations/awesome-farm/customer-categories/veg/offers/offer-002> ;
                                     dfc-b:hasQuantity [ a dfc-b:QuantitativeValue ;
                                                         dfc-b:hasUnit dfc-m:Kilogram ;
                                                         dfc-b:value 2.0 ] ] .
      responses:
        '200':
          description: >-
            updated, representation returned. The body is omitted when
            Prefer: return=minimal is sent.
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/orders/order-001/index
        '201':
          description: created, because no representation existed at this IRI
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/orders/order-001/index
        '204':
          description: updated, no body returned
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: order not found
        '409':
          description: >-
            conflict. The representation exists and the request asserted that it
            must not.
        '412':
          description: >-
            precondition failed. If-Match did not match the current
            representation, or If-None-Match: * was sent and one exists.
