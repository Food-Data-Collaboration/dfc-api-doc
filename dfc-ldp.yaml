    delete:
      summary: Delete Resource
      description: |
        Removes one of the organization's template sale sessions, closing that
        sales channel.

        The organization's dfc-b:hasTemplateSaleSession no longer references the
        removed session, and the container's ldp:contains and ldp:member lists are
        updated to match. The other sessions the organization holds are untouched:
        an organization with a webshop, a market stall and a courier round can lose
        one channel without affecting the other two.

        Sale sessions already instantiated from this template are not deleted. The
        template describes how a channel is set up; sessions created from it are
        independent resources and stay as they are.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: >-
          ETag of the current representation. The write fails with 412 if it no
          longer matches, which prevents a lost update.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: >-
          Send * to require that no current representation exists, making this
          a create-only request. A write to an existing resource fails with 412.
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: resource not found
        '412':
          description: >-
            precondition failed. If-Match did not match the current
            representation.
