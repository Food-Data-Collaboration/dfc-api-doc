  "/organizations/{organizationId}/orders":
    get:
      summary: Get Organization Orders Container
      description: Returns the orders LDP container for an organization.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/orders/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/orders/order-001/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/orders/order-001/index]
        '404':
          description: organization not found
    post:
      summary: Create an Order in the Organization Container
      description: |
        Creates an order as a member of the organization's orders container, together with
        its order lines.

        dfc-b:Order is a relation, not an entity, so this differs from the other containers:
        an order is placed against a sale session and its lines are what the order is
        for. The body may therefore carry OrderLine members alongside the Order, as
        blank nodes referenced from dfc-b:hasPart. The server assigns an IRI to the
        order and to each line, and creates them atomically: either the whole order
        exists afterwards or none of it does.

        To add a further line to an existing order, POST to the order's orderlines container
        instead. The four properties dfc-b:Order carries on its own behalf -- dfc-b:belongsTo,
        dfc-b:orderedBy, dfc-b:selects and dfc-b:uses -- are each cardinality 1 in the
        ontology and belong to the order, not to any line.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: Prefer
        in: header
        required: false
        description: >-
          Response preference. return=minimal omits the response body; the
          status code and headers are unchanged.
        schema:
          type: string
          example: return=representation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#order"
                  "@type": dfc-b:Order
                  dfc-b:belongsTo: https://platform.ex/organizations/awesome-farm/sale-sessions/saturday-market/index
                  dfc-b:orderedBy: https://platform.ex/persons/jane-shopper/index
                  dfc-b:selects: https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/standard-delivery
                  dfc-b:uses:
                    "@type": dfc-b:PaymentMethod
                    dfc-b:paymentMethodType: CreditCard
                  dfc-b:hasPart: ["#line-1", "#line-2"]
                - "@id": "#line-1"
                  "@type": dfc-b:OrderLine
                  dfc-b:concerns: https://platform.ex/organizations/awesome-farm/customer-categories/basil/offers/offer-001
                  dfc-b:hasQuantity:
