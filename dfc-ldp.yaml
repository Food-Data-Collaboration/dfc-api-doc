openapi: 3.0.1
info:
  title: DFC LDP Container Discovery API
  version: v2.0.0
  contact:
    {
      "name": "DFC General Contact" ,
      "url": "https://www.dfc-standard.org/" ,
      "email": "hello@dfc-standard.org"
    }
  description: |
    <p>
    DFC LDP Container Discovery API implements the Data Food Consortium (DFC) v2.0.0 specifications.
    This API provides discoverability endpoints for DFC platforms including Platform WebIDs,
    User WebIDs, Organization containers, and Identity Service endpoints.
    <p>
components:
  securitySchemes:
    oidc_token:
      type: openIdConnect
      openIdConnectUrl: https://login.fooddatacollaboration.org.uk/auth/realm/dev

security:
- oidc_token: []

paths:
  /webid:
    get:
      summary: Get Platform WebID
      description: |
        Returns the public platform WebID document.
        The platform WebID MUST advertise supported protocol and ontology versions,
        and provide a link to the Identity Service.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      tags:
      - WebID
      responses:
        '200':
          description: successful
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/webid
                    "@type": foaf:PersonalProfileDocument
                    foaf:maker: https://platform.ex/webid#me
                    foaf:primaryTopic: https://platform.ex/webid#me
                  - "@id": https://platform.ex/webid#me
                    "@type":
                    - dfc-t:Platform
                    - foaf:Agent
                    foaf:name: Example platform
                    dfc-t:supportedProtocolVersion: "2.0.0"
                    dfc-t:supportedOntologyVersion: "2.0.0"
                    dfc-t:hasIdentityService: https://platform.ex/identity-service

  /identity-service:
    head:
      summary: Get User WebID via Identity Service
      description: |
        Returns the user's WebID on this platform in exchange for a valid OIDC token.
        The token MUST contain the user's email address. Returns 303 See Other with
        Location header pointing to the user's WebID. If the WebID doesn't exist,
        it is created before returning.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      tags:
      - Identity Service
      responses:
        '303':
          description: See Other - redirects to user's WebID
          headers:
            Location:
              description: URL of the user's WebID
              schema:
                type: string
                format: uri
        '400':
          description: Bad Request - malformed or missing email in token
        '403':
          description: Forbidden - invalid OIDC token

  "/users/{userId}/webid":
    get:
      summary: Get User WebID
      description: |
        Returns the public WebID document for a DFC user. User WebIDs are linked
        to private preferences documents and TypeIndexes.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/users/john/webid
                    "@type": foaf:PersonalProfileDocument
                    foaf:maker: https://platform.ex/users/john/webid#me
                    foaf:primaryTopic: https://platform.ex/users/john/webid#me
                  - "@id": https://platform.ex/users/john/webid#me
                    "@type": foaf:Agent
                    pim:preferencesFile: https://platform.ex/users/john/prefs
        '404':
          description: user not found

  "/users/{userId}/prefs":
    get:
      summary: Get User Preferences
      description: |
        Returns the user's preferences document, which links to their private TypeIndex.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/users/john/prefs
                    "@type": pim:ConfigurationFile
                  - "@id": https://platform.ex/users/john/webid#me
                    solid:privateTypeIndex: https://platform.ex/users/john/privateTypeIndex
        '404':
          description: user not found

  "/users/{userId}/privateTypeIndex":
    get:
      summary: Get User's Private Type Index
      description: |
        Returns the private TypeIndex that registers instances of Organization for this user.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/users/john/privateTypeIndex
                    "@type":
                    - solid:TypeIndex
                    - solid:ListedDocument
                  - "@id": https://platform.ex/users/john/privateTypeIndex#reg1
                    "@type": solid:TypeIndexRegistration
                    solid:forClass: dfc-b:Organization
                    solid:instance: https://platform.ex/organizations/awesome-farm/index
        '404':
          description: user not found

  "/organizations":
    get:
      summary: List Organizations
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      tags:
      - Organizations
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/index, https://platform.ex/organizations/janes-farm/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/index, https://platform.ex/organizations/janes-farm/index]
                    ldp:ModifiedDate: "2026-01-15T10:30:00.000Z"

  "/organizations/{organizationId}":
    get:
      summary: Get Organization (Enterprise container)
      description: |
        Returns the organization container index. An organization container is a LDP
        container containing catalogs, supplied-products, and orders.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/index
                    "@type": dfc-b:Organization
                    dfc-b:name: John's Farm
                    dfc-b:hasTemplateSaleSession: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/]
                    dfc-b:hasCertification: [https://platform.ex/organizations/awesome-farm/certifications/]
                    dfc-b:hasAddress: [https://platform.ex/organizations/awesome-farm/addresses/]
                    dfc-b:supplies: [https://platform.ex/organizations/awesome-farm/supplied-products/]
                    dfc-b:manages: [https://platform.ex/organizations/awesome-farm/catalogs/]
                    dfc-b:orders: [https://platform.ex/organizations/awesome-farm/orders/]
        '404':
          description: organization not found
    put:
      summary: Update the Organization
      description: |
        Replaces the organization at this IRI.

        An organization is created during onboarding rather than through this API, so this
        cannot create one: the resource always exists. Use PATCH to change only
        some properties. Send If-Match with the ETag from a prior read to make the write
        conditional, so a concurrent change fails with 412 rather than being silently
        overwritten.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: >-
          ETag of the current representation. The write fails with 412 if it no
          longer matches, which prevents a lost update.
        schema:
          type: string
      - name: Prefer
        in: header
        required: false
        description: >-
          Response preference. return=minimal omits the response body; the
          status code and headers are unchanged.
        schema:
          type: string
          example: return=representation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#"
                  "@type": dfc-b:Organization
                  dfc-b:name: John's Farm
                  dfc-b:description: Family farm growing vegetables and herbs
                  dfc-b:hasMainContact: https://platform.ex/persons/fred-farm/index
                  dfc-b:hasAddress: [https://platform.ex/organizations/awesome-farm/addresses/farm-address/index]
                  dfc-b:websitePage: https://platform.ex/
          text/turtle:
            schema:
              example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-pt: <https://w3id.org/dfc/taxonomies/v2.0.0/productTypes.rdf#> .
                  @prefix dfc-m:  <https://w3id.org/dfc/taxonomies/v2.0.0/measures.rdf#> .
                  <> a dfc-b:Organization ;
                      dfc-b:name "John's Farm" ;
                      dfc-b:description "Family farm growing vegetables and herbs" ;
                      dfc-b:hasMainContact <https://platform.ex/persons/fred-farm/index> ;
                      dfc-b:hasAddress <https://platform.ex/organizations/awesome-farm/addresses/farm-address/index> ;
                      dfc-b:websitePage <https://platform.ex/> .
      responses:
        '200':
          description: >-
            updated, representation returned. The body is omitted when
            Prefer: return=minimal is sent.
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/index
        '204':
          description: updated, no body returned
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: organization not found
        '412':
          description: >-
            precondition failed. If-Match did not match the current
            representation.
    patch:
      summary: Partially Update the Organization
      description: |
        Applies a partial update to the organization at this IRI. Only the properties
        present in the body are changed; absent properties are left as they are. A PUT
        replaces the whole representation, which is the better fit when the client holds a
        complete copy and PATCH when it does not.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: >-
          ETag of the current representation. The write fails with 412 if it no
          longer matches, which prevents a lost update.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#"
                  "@type": dfc-b:Organization
                  dfc-b:name: John's Farm
                  dfc-b:description: Family farm growing vegetables and herbs
                  dfc-b:hasMainContact: https://platform.ex/persons/fred-farm/index
                  dfc-b:hasAddress: [https://platform.ex/organizations/awesome-farm/addresses/farm-address/index]
                  dfc-b:websitePage: https://platform.ex/
          text/turtle:
            schema:
              example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-pt: <https://w3id.org/dfc/taxonomies/v2.0.0/productTypes.rdf#> .
                  @prefix dfc-m:  <https://w3id.org/dfc/taxonomies/v2.0.0/measures.rdf#> .
                  <> a dfc-b:Organization ;
                      dfc-b:name "John's Farm" ;
                      dfc-b:description "Family farm growing vegetables and herbs" ;
                      dfc-b:hasMainContact <https://platform.ex/persons/fred-farm/index> ;
                      dfc-b:hasAddress <https://platform.ex/organizations/awesome-farm/addresses/farm-address/index> ;
                      dfc-b:websitePage <https://platform.ex/> .
      responses:
        '200':
          description: updated, with the full resulting representation
          headers:
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/index
            text/turtle:
              schema:
                example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-pt: <https://w3id.org/dfc/taxonomies/v2.0.0/productTypes.rdf#> .
                  @prefix dfc-m:  <https://w3id.org/dfc/taxonomies/v2.0.0/measures.rdf#> .
                  <> a dfc-b:Resource .
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: organization not found
        '412':
          description: >-
            precondition failed. If-Match did not match the current
            representation.
  "/organizations/{organizationId}/catalogs":
    get:
      summary: Get Organization Catalogs Container
      description: |
        Returns the catalogs LDP container for an organization.
        Catalogs contain catalog items, offers, and prices.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/catalogs/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index]
        '404':
          description: organization not found
    post:
      summary: Create a Catalog in the Organization Container
      description: |
        Creates a catalog for the organization.

        A catalog groups the items an organization offers, and is maintained by
        exactly one organization -- dfc-b:maintainedBy carries cardinality 1 in
        the ontology, so the owning organization is fixed by the catalog itself.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: Prefer
        in: header
        required: false
        description: >-
          Response preference. return=minimal omits the response body; the
          status code and headers are unchanged.
        schema:
          type: string
          example: return=representation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#"
                  "@type": dfc-b:Catalog
                  dfc-b:name: Main Catalog
                  dfc-b:maintainedBy: https://platform.ex/organizations/awesome-farm/index
                  dfc-b:lists: [https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/items/TOM-001/index]
          text/turtle:
            schema:
              example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-f:  <https://w3id.org/dfc/taxonomies/v2.0.0/facets.rdf#> .
                  [] a dfc-b:Catalog ;
                      dfc-b:name "Main Catalog" ;
                      dfc-b:maintainedBy <https://platform.ex/organizations/awesome-farm/index> ;
                      dfc-b:lists <https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/items/TOM-001/index> .
      responses:
        '201':
          description: >-
            created. The response body is omitted when Prefer: return=minimal is
            sent; the status code and headers are unchanged.
          headers:
            Location:
              description: IRI of the created resource, assigned by the server
              schema:
                type: string
                format: uri
            Content-Location:
              description: >-
                IRI of the created resource. Identical to Location here; both are
                returned so a client can rely on either.
              schema:
                type: string
                format: uri
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: organization not found
  "/organizations/{organizationId}/certifications":
    get:
      summary: Get Organization Certifications Container
      description: |
        Returns the certifications LDP container for an organization.
        Certifications represent organic, fair-trade, or other certifications held by the organization.
        Each certification includes operatorId, certiferReference, and optional certificationScore.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/certifications/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/certifications/organic-eu/index, https://platform.ex/organizations/awesome-farm/certifications/demeter/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/certifications/organic-eu/index, https://platform.ex/organizations/awesome-farm/certifications/demeter/index]
        '404':
          description: organization not found
    post:
      summary: Create a Certification in the Organization Container
      description: |
        Creates a certification held by the organization.

        A certification records a scheme the organization is certified under, the
        certifying body via dfc-b:isCertifiedBy, and the scheme's concept via
        dfc-b:hasCertification. dfc-b:operatorId and dfc-b:certiferReference carry
        the scheme operator's identifier and this organization's reference under
        it; dfc-b:certificationScore is left empty when the scheme has no score.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: Prefer
        in: header
        required: false
        description: >-
          Response preference. return=minimal omits the response body; the
          status code and headers are unchanged.
        schema:
          type: string
          example: return=representation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#"
                  "@type": dfc-b:Certification
                  dfc-b:name: EU Organic Certification
                  dfc-b:isCertifiedBy: https://platform.ex/organizations/awesome-farm/index
                  dfc-b:hasCertification: dfc-f:Organic-EU
                  dfc-b:operatorId: "FR-BIO-01"
                  dfc-b:certiferReference: "UK-ORG-05"
                  dfc-b:certificationScore: ""
          text/turtle:
            schema:
              example: |
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-f:  <https://w3id.org/dfc/taxonomies/v2.0.0/facets.rdf#> .
                  [] a dfc-b:Certification ;
                      dfc-b:name "EU Organic Certification" ;
                      dfc-b:isCertifiedBy <https://platform.ex/organizations/awesome-farm/index> ;
                      dfc-b:hasCertification dfc-f:Organic-EU ;
                      dfc-b:operatorId "FR-BIO-01" ;
                      dfc-b:certiferReference "UK-ORG-05" ;
                      dfc-b:certificationScore "" .
      responses:
        '201':
          description: >-
            created. The response body is omitted when Prefer: return=minimal is
            sent; the status code and headers are unchanged.
          headers:
            Location:
              description: IRI of the created resource, assigned by the server
              schema:
                type: string
                format: uri
            Content-Location:
              description: >-
                IRI of the created resource. Identical to Location here; both are
                returned so a client can rely on either.
              schema:
                type: string
                format: uri
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/certifications/organic-eu/index
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: organization not found
  "/organizations/{organizationId}/certifications/{certificationId}/index":
    get:
      summary: Get Certification Index
      description: |
        Returns the certification index document containing certification details.
        Includes operatorId (organic licence number), certiferReference (certifying body ID),
        and optional certificationScore for applicable standards.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
