    put:
      summary: Update a Template Sale Session
      description: |
        Replaces one of the organization's template sale sessions.

        This changes the sales channel a session describes -- its virtual or
        physical place, its opening cycle, its shipping options -- without
        touching the other sessions the organization holds. A PUT here replaces
        the whole representation, which is the better fit when the client holds a
        complete copy and PATCH when it does not.

        The example converts the session to an Open Food Network store with a
        weekly order cycle, orders closing on Tuesday evening.
