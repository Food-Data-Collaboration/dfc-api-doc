  "/organizations/{organizationId}/template-sale-sessions":
    get:
      summary: Get Organization Template Sale Sessions Container
      description: |
        Returns the template sale sessions LDP container for an organization.
        TemplateSaleSessions hold distribution patterns including:
        - Recurring schedules (using iCal rrule)
        - GeoJSON features for pickup points and delivery areas
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index]
        '404':
          description: organization not found
    post:
      summary: Create a Template Sale Session in the Organization Container
      description: |
        Creates one template sale session for the organization.

        An organization holds a session per sales method: one per webshop, per
        delivery route or schedule, per pickup point, and so on. They are not
        one-to-one -- an organization running a Shopify store, an Open Food Network
        store and a weekly courier round holds three of these, and each names the
        place it is sold through with dfc-b:hostedAt. The owning organization is
        named by dfc-b:isTemplateSaleSessionOf, the inverse of the organization's
        dfc-b:hasTemplateSaleSession.

        This example opens a Shopify webshop as a virtual place, with a daily
        opening cycle. The PUT example for the same resource switches to an Open
        Food Network store on a weekly order cycle.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: Prefer
        in: header
        required: false
        description: >-
          Response preference. return=minimal omits the response body; the
          status code and headers are unchanged.
        schema:
          type: string
          example: return=representation
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#"
                  "@type": dfc-b:TemplateSaleSession
                  dfc-b:name: Farm Shop (online)
                  dfc-b:isTemplateSaleSessionOf: https://platform.ex/organizations/awesome-farm/index
                  dfc-b:hostedAt: "#place"
                  dfc-b:occursAt: "#schedule"
                  dfc-b:hasOption: "#shipping"
                  dfc-b:objectOf: "#coordination"
                - "@id": "#place"
                  "@type": dfc-b:VirtualPlace
                  dfc-b:name: John's Farm Webshop
                  dfc-b:URL: https://shop.johns-farm.example/
                - "@id": "#schedule"
                  "@type": "http://www.w3.org/2002/12/cal/icaltzd#Vevent"
                  "http://www.w3.org/2002/12/cal/icaltzd#dtstart":
                    "@type": "http://www.w3.org/2001/XMLSchema#dateTime"
                    "@value": "2026-01-05T00:00:00Z"
                  "http://www.w3.org/2002/12/cal/icaltzd#dtend":
                    "@type": "http://www.w3.org/2001/XMLSchema#dateTime"
                    "@value": "2026-12-31T23:59:59Z"
                  "http://www.w3.org/2002/12/cal/icaltzd#rrule":
                    "@type": "http://www.w3.org/2002/12/cal/icaltzd#Value_RECUR"
                    "http://www.w3.org/2002/12/cal/icaltzd#freq": DAILY
                    "http://www.w3.org/2002/12/cal/icaltzd#interval": 1
                - "@id": "#shipping"
                  "@type": dfc-b:ShippingOption
                  dfc-b:name: Courier, next working day
                - "@id": "#coordination"
                  "@type": dfc-b:Coordination
                  dfc-b:coordinatedBy: https://platform.ex/organizations/awesome-farm/index
                  dfc-b:hasObject: "#"
          text/turtle:
            schema:
              example: |
                  @prefix cal:  <http://www.w3.org/2002/12/cal/icaltzd#> .
                  @prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .
                  @prefix dfc-b:  <https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.owl#> .
                  @prefix dfc-pt: <https://w3id.org/dfc/taxonomies/v2.0.0/productTypes.rdf#> .
                  @prefix dfc-m:  <https://w3id.org/dfc/taxonomies/v2.0.0/measures.rdf#> .
                  [] a dfc-b:TemplateSaleSession ;
                      dfc-b:name "Farm Shop (online)" ;
                      dfc-b:isTemplateSaleSessionOf <https://platform.ex/organizations/awesome-farm/index> ;
                      dfc-b:hostedAt [ a dfc-b:VirtualPlace ;
                                      dfc-b:name "John's Farm Webshop" ;
                                      dfc-b:URL <https://shop.johns-farm.example/> ] ;
                      dfc-b:occursAt [ a cal:Vevent ;
                                      cal:dtstart "2026-01-05T00:00:00Z"^^xsd:dateTime ;
                                      cal:dtend "2026-12-31T23:59:59Z"^^xsd:dateTime ;
                                      cal:rrule [ a cal:Value_RECUR ;
                                                    cal:freq "DAILY" ;
                                                    cal:interval 1 ] ] ;
                      dfc-b:hasOption [ a dfc-b:ShippingOption ;
                                        dfc-b:name "Courier, next working day" ] ;
                      dfc-b:objectOf [ a dfc-b:Coordination ;
                                       dfc-b:coordinatedBy <https://platform.ex/organizations/awesome-farm/index> ;
                                       dfc-b:hasObject [] ] .
      responses:
        '201':
          description: >-
            created. The response body is omitted when Prefer: return=minimal is
            sent; the status code and headers are unchanged.
          headers:
            Location:
              description: IRI of the created resource, assigned by the server
              schema:
                type: string
                format: uri
            Content-Location:
              description: >-
                IRI of the created resource. Identical to Location here; both are
                returned so a client can rely on either.
              schema:
                type: string
                format: uri
            ETag:
              description: >-
                Entity tag of the current representation. Supply it as If-Match on a
                later write to avoid a lost update.
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/webshop/index
        '400':
          description: bad request
        '401':
          description: unauthorized
        '404':
          description: organization not found
