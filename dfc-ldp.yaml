      summary: Delete Resource
      description: |
        Deletes the route and removes it from the organization's routes container.

        Any sale session that named this route with dfc-b:usedInRoute keeps that
        reference, which then stops resolving. The container's ldp:contains and
        ldp:member lists are updated to no longer reference the removed route.
