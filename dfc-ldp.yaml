        required: true
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph":
                - "@id": "#"
                  "@type": dfc-b:Address
                  dfc-b:hasCountry: GBR
