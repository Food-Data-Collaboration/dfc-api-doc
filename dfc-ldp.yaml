openapi: 3.0.1
info:
  title: DFC LDP Container Discovery API
  version: v2.0.0
  contact:
    {
      "name": "DFC General Contact" ,
      "url": "https://www.dfc-standard.org/" ,
      "email": "hello@dfc-standard.org"
    }
  description: |
    <p>
    DFC LDP Container Discovery API implements the Data Food Consortium (DFC) v2.0.0 specifications.
    This API provides discoverability endpoints for DFC platforms including Platform WebIDs,
    User WebIDs, Organization containers, and Identity Service endpoints.
    <p>
components:
  securitySchemes:
    oidc_token:
      type: openIdConnect
      openIdConnectUrl: https://login.lescommuns.org/auth/realm/datafoodconsortium

security:
- oidc_token: []

paths:
  /webid:
    get:
      summary: Get Platform WebID
      description: |
        Returns the public platform WebID document.
        The platform WebID MUST advertise supported protocol and ontology versions,
        and provide a link to the Identity Service.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      tags:
      - WebID
      responses:
        '200':
          description: successful
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/webid
                    "@type": foaf:PersonalProfileDocument
                    foaf:maker: https://platform.ex/webid#me
                    foaf:primaryTopic: https://platform.ex/webid#me
                  - "@id": https://platform.ex/webid#me
                    "@type":
                    - dfc-t:Platform
                    - foaf:Agent
                    foaf:name: Example platform
                    dfc-t:supportedProtocolVersion: "2.0.0"
                    dfc-t:supportedOntologyVersion: "2.0.0"
                    dfc-t:hasIdentityService: https://platform.ex/identity-service

  /identity-service:
    head:
      summary: Get User WebID via Identity Service
      description: |
        Returns the user's WebID on this platform in exchange for a valid OIDC token.
        The token MUST contain the user's email address. Returns 303 See Other with
        Location header pointing to the user's WebID. If the WebID doesn't exist,
        it is created before returning.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      tags:
      - Identity Service
      responses:
        '303':
          description: See Other - redirects to user's WebID
          headers:
            Location:
              description: URL of the user's WebID
              schema:
                type: string
                format: uri
        '400':
          description: Bad Request - malformed or missing email in token
        '403':
          description: Forbidden - invalid OIDC token

  "/users/{userId}/webid":
    get:
      summary: Get User WebID
      description: |
        Returns the public WebID document for a DFC user. User WebIDs are linked
        to private preferences documents and TypeIndexes.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/users/john/webid
                    "@type": foaf:PersonalProfileDocument
                    foaf:maker: https://platform.ex/users/john/webid#me
                    foaf:primaryTopic: https://platform.ex/users/john/webid#me
                  - "@id": https://platform.ex/users/john/webid#me
                    "@type": foaf:Agent
                    pim:preferencesFile: https://platform.ex/users/john/prefs
        '404':
          description: user not found

  "/users/{userId}/prefs":
    get:
      summary: Get User Preferences
      description: |
        Returns the user's preferences document, which links to their private TypeIndex.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/users/john/prefs
                    "@type": pim:ConfigurationFile
                  - "@id": https://platform.ex/users/john/webid#me
                    solid:privateTypeIndex: https://platform.ex/users/john/privateTypeIndex
        '404':
          description: user not found

  "/users/{userId}/privateTypeIndex":
    get:
      summary: Get User's Private Type Index
      description: |
        Returns the private TypeIndex that registers instances of Organization for this user.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@graph":
                  - "@id": https://platform.ex/users/john/privateTypeIndex
                    "@type":
                    - solid:TypeIndex
                    - solid:ListedDocument
                  - "@id": https://platform.ex/users/john/privateTypeIndex#reg1
                    "@type": solid:TypeIndexRegistration
                    solid:forClass: dfc-b:Organization
                    solid:instance: https://platform.ex/organizations/awesome-farm/index
        '404':
          description: user not found

  "/organizations":
    get:
      summary: List Organizations
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      tags:
      - Organizations
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/index, https://platform.ex/organizations/janes-farm/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/index, https://platform.ex/organizations/janes-farm/index]
                    ldp:ModifiedDate: "2026-01-15T10:30:00.000Z"

  "/organizations/{organizationId}":
    get:
      summary: Get Organization (Enterprise container)
      description: |
        Returns the organization container index. An organization container is a LDP
        container containing catalogs, supplied-products, and orders.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/index
                    "@type": dfc-b:Organization
                    dfc-b:name: John's Farm
                    dfc-b:hasTemplateSaleSession: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/]
                    dfc-b:hasCertification: [https://platform.ex/organizations/awesome-farm/certifications/]
                    dfc-b:hasAddress: [https://platform.ex/organizations/awesome-farm/addresses/]
                    dfc-b:supplies: [https://platform.ex/organizations/awesome-farm/supplied-products/]
                    dfc-b:manages: [https://platform.ex/organizations/awesome-farm/catalogs/]
                    dfc-b:orders: [https://platform.ex/organizations/awesome-farm/orders/]
        '404':
          description: organization not found

  "/organizations/{organizationId}/catalogs":
    get:
      summary: Get Organization Catalogs Container
      description: |
        Returns the catalogs LDP container for an organization.
        Catalogs contain catalog items, offers, and prices.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/catalogs/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index]
        '404':
          description: organization not found

  "/organizations/{organizationId}/certifications":
    get:
      summary: Get Organization Certifications Container
      description: |
        Returns the certifications LDP container for an organization.
        Certifications represent organic, fair-trade, or other certifications held by the organization.
        Each certification includes operatorId, certiferReference, and optional certificationScore.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/certifications/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/certifications/organic-eu/index, https://platform.ex/organizations/awesome-farm/certifications/demeter/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/certifications/organic-eu/index, https://platform.ex/organizations/awesome-farm/certifications/demeter/index]
        '404':
          description: organization not found

  "/organizations/{organizationId}/certifications/{certificationId}/index":
    get:
      summary: Get Certification Index
      description: |
        Returns the certification index document containing certification details.
        Includes operatorId (organic licence number), certiferReference (certifying body ID),
        and optional certificationScore for applicable standards.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: certificationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/certifications/organic-eu/index
                    "@type": dfc-b:Certification
                    dfc-b:name: EU Organic Certification
                    dfc-b:isCertifiedBy: https://platform.ex/organizations/awesome-farm/index
                    dfc-b:hasCertification: dfc-f:Organic-EU
                    dfc-b:operatorId: "FR-BIO-01"
                    dfc-b:certiferReference: "UK-ORG-05"
                    dfc-b:certificationScore: ""
                  - "@id": https://platform.ex/organizations/awesome-farm/certifications/demeter/index
                    "@type": dfc-b:Certification
                    dfc-b:name: Demeter Biodynamic Certification
                    dfc-b:isCertifiedBy: https://platform.ex/organizations/awesome-farm/index
                    dfc-b:hasCertification: dfc-f:Demeter
                    dfc-b:operatorId: "FR-DEM-12345"
                    dfc-b:certiferReference: "DEM-INT-001"
                    dfc-b:certificationScore: "RegenScore-A"
        '404':
          description: certification not found

  "/organizations/{organizationId}/catalogs/{catalogId}/index":
    get:
      summary: Get Catalog Index
      description: |
        Returns the catalog index document containing catalog items, offers, and prices.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: catalogId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index
                    "@type": dfc-b:Catalog
                    dfc-b:name: Main Catalog
                    dfc-b:maintainedBy: https://platform.ex/organizations/awesome-farm/index
                  - "@id": https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index#catalogItem1
                    "@type": dfc-b:CatalogItem
                    dfc-b:references: https://platform.ex/organizations/awesome-farm/supplied-products/tomato/index
                    dfc-b:offeredThrough:
                      "@id": https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index#offer1
                      "@type": dfc-b:Offer
                      dfc-b:hasPrice:
                        "@id": https://platform.ex/organizations/awesome-farm/catalogs/main-catalog/index#price1
                        "@type": dfc-b:Price
                        dfc-b:hasUnit: EUR
                        dfc-b:value: 2.4
        '404':
          description: catalog not found

  "/organizations/{organizationId}/supplied-products":
    get:
      summary: Get Organization Supplied Products Container
      description: |
        Returns the supplied products LDP container for an organization.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/supplied-products/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/supplied-products/tomato/index, https://platform.ex/organizations/awesome-farm/supplied-products/basil/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/supplied-products/tomato/index, https://platform.ex/organizations/awesome-farm/supplied-products/basil/index]
        '404':
          description: organization not found

  "/organizations/{organizationId}/supplied-products/{productId}/index":
    get:
      summary: Get Supplied Product Index
      description: Returns the index document for a supplied product.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/supplied-products/tomato/index
                    "@type": dfc-b:SuppliedProduct
                    dfc-b:producedBy: https://platform.ex/organizations/awesome-farm/index
                    dfc-b:name: Organic Tomatoes
                    dfc-b:hasType: dfc-pt:tomato
                    dfc-b:hasQuantity:
                      "@type": dfc-b:QuantitativeValue
                      dfc-b:hasUnit: dfc-m:Kilogram
                      dfc-b:value: 1.0
        '404':
          description: product not found

  "/organizations/{organizationId}/orders":
    get:
      summary: Get Organization Orders Container
      description: Returns the orders LDP container for an organization.
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/orders/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/orders/order-001/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/orders/order-001/index]
        '404':
          description: organization not found

  "/organizations/{organizationId}/template-sale-sessions":
    get:
      summary: Get Organization Template Sale Sessions Container
      description: |
        Returns the template sale sessions LDP container for an organization.
        TemplateSaleSessions hold distribution patterns including:
        - Recurring schedules (using iCal rrule)
        - GeoJSON features for pickup points and delivery areas
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index]
        '404':
          description: organization not found

  "/organizations/{organizationId}/template-sale-sessions/{sessionId}/index":
    get:
      summary: Get Template Sale Session Index
      description: |
        Returns the template sale session index document.
        Contains scheduling information (iCal recurrence rules) and GeoJSON features
        for pickup points (Point) and delivery areas (Polygon).
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index
                    "@type": dfc-b:TemplateSaleSession
                    dfc-b:name: Weekly Delivery Route
                    dfc-b:coordinatedBy: https://platform.ex/organizations/awesome-farm/index
                    dfc-b:hasGeoJsonFeature: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index#deliveryArea]
                    dfc-b:occursAt: [https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index#schedule]
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index#schedule
                    "@type": cal:Vevent
                    cal:dtstart:
                      "@type": xsd:dateTime
                      "@value": "2026-01-07T00:00:00Z"
                    cal:dtend:
                      "@type": xsd:dateTime
                      "@value": "2026-12-31T23:59:59Z"
                    rdfcal:rrule:
                      "@type": cal:Value_RECUR
                      cal:freq: WEEKLY
                      cal:byday: TU
                    cal:interval: 1
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index#deliveryArea
                    "@type": geojson:Feature
                    geojson:geometry:
                      "@type": geojson:Polygon
                      geojson:coordinates:
                        - - - -2.5
                          - 48.8
                        - - -2.3
                          - 48.8
                        - - -2.3
                          - 48.9
                        - - -2.5
                          - 48.9
                        - - -2.5
                          - 48.8
                    geojson:properties:
                      "@type": geojson:Properties
                      name: Rennes Delivery Area
                      description: Weekly delivery to Rennes area
                  - "@id": https://platform.ex/organizations/awesome-farm/template-sale-sessions/weekly-delivery/index#pickupPoint1
                    "@type": geojson:Feature
                    geojson:geometry:
                      "@type": geojson:Point
                      geojson:coordinates:
                        - -2.4
                          - 48.85
                    geojson:properties:
                      "@type": geojson:Properties
                      name: Farm Gate Pickup
                      description: Collect from farm on Tuesdays 4-6pm
        '404':
          description: template sale session not found

  "/organizations/{organizationId}/physical-places":
    get:
      summary: Get Organization Physical Places Container
      description: |
        Returns the physical places LDP container for an organization.
        Physical places represent locations such as pickup points and delivery areas,
        and contain GeoJSON features (Point or Polygon geometries).
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          headers:
            Link:
              description: LDP BasicContainer link relation
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
                  - "@id": https://platform.ex/organizations/awesome-farm/physical-places/
                    "@type": [ldp:Container, ldp:BasicContainer]
                    ldp:hasMemberRelation: ldp:contains
                    ldp:member: [https://platform.ex/organizations/awesome-farm/physical-places/farm-location/index, https://platform.ex/organizations/awesome-farm/physical-places/delivery-zone-north/index]
                    ldp:contains: [https://platform.ex/organizations/awesome-farm/physical-places/farm-location/index, https://platform.ex/organizations/awesome-farm/physical-places/delivery-zone-north/index]
        '404':
          description: organization not found

  "/organizations/{organizationId}/physical-places/{placeId}/index":
    get:
      summary: Get Physical Place Index
      description: |
        Returns the physical place index document containing GeoJSON features.
        Physical places can be pickup locations (Point geometry) or delivery areas
        (Polygon geometry).
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: placeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              schema:
                example:
                  "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                  "@graph":
