
openapi: 3.0.1
info:
  title: DFC Sample API
  version: v2.0.0
  contact:
    {
      "name": "DFC General Contact" ,
      "url": "https://www.dfc-standard.org/" ,
      "email": "hello@dfc-standard.org"
    }
  description: |
    <p>
    This API implements the Data Food Consortium (DFC) specifications.
    It serves and reads semantic data encoded in JSON-LD.
    <p>
components:
  securitySchemes:
    oidc_token:
      type: openIdConnect
      openIdConnectUrl: https://login.lescommuns.org/auth/realm/datafoodconsortium

security:
- oidc_token: []
paths:
  "/api/dfc/Addresses/{id}":
    get:
      summary: Show address
      parameters:
    - name: x-dfc-version
      in: header
      required: true
      schema:
        type: string
        example: "2.0.0"
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Addresses
      responses:
        '200':
          description: successful
          content:
            application/ld+json:
              examples:
                test_example:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@id": http://test.host/api/dfc/Addresses/40000
                    "@type": dfc-b:Address
                    dfc-b:street: 10 Lovely Street
                    dfc-b:postcode: '20170'
                    dfc-b:city: Herndon
                    dfc-b:hasCountry: USA
                    dfc-b:region: Virginia
                    dfc-b:latitude: 38.89750
                    dfc-b:longitude: -77.00920
                    dfc-b:addressOf: http://test.host/api/dfc/Organizations/10000
        '404':
          description: not found
  "/api/dfc/Organizations/{enterprise_id}/CatalogItems":
    get:
      summary: Show CatalogItem
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CatalogItems
      responses:
        '200':
          description: success
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              examples:
                test_example:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/Organizations/10000/CatalogItems/10001
                      "@type": dfc-b:CatalogItem
                      dfc-b:references: http://test.host/api/dfc/Organizations/10000/SuppliedProducts/10002
                      dfc-b:sku: AR
                      dfc-b:stockLimitation: 0
                      dfc-b:offeredThrough: http://test.host/api/dfc/Organizations/10000/customerCategories/10005/Offers/10001
                    - "@id": http://test.host/api/dfc/Organizations/10000/customerCategories/10005/Offers/10001
                      "@type": dfc-b:Offer
                      dfc-b:hasPrice: 19.99
                      dfc-b:stockLimitation: 0
        '404':
          description: not found
    post:
      summary: create a new CatalogItem for a given Organization
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      tags:
      tags:
      - CatalogItems
      requestBody:
        content:
          application/ld+json:
            schema:
              example:
                "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                "@graph": [
                {
                  "@id": "#" ,
                  "@type": dfc-b:CatalogItem ,
                  dfc-b:references: http://test.host/api/dfc/Organizations/10000/SuppliedProducts/10002 ,
                  dfc-b:sku: AR ,
                  dfc-b:stockLimitation: 0 ,
                  dfc-b:offeredThrough: {
                    "@id": "#1" ,
                    "@type": dfc-b:Offer ,
                    dfc-b:hasPrice: {
                      "@id": "#2" ,
                      "@type": dfc-b:Price ,
                      dfc-b:hasUnit: GBP ,
                      dfc-b:value: 4.95 ,
                      dfc-b:VATrate: 0.0
                    }
                  }
                }
                ]
      responses:
        '201':
          description: created
          content:
            application/ld+json:
              schema:
                example:
                  "@id": http://test.host/api/dfc/Organizations/10000/CatalogItems/10001
        '400':
          description: bad request
        '401':
          description: unauthorized
    put:
      summary: Update CatalogItem
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CatalogItems
      responses:
        '204':
          description: no content
      requestBody:
        content:
          application/ld+json:
            schema:
              example:
                "@context":
                  rdfs: http://www.w3.org/2000/01/rdf-schema#
                  skos: http://www.w3.org/2004/02/skos/core#
                  dfc: http://static.datafoodconsortium.org/ontologies/DFC_FullModel.owl#
                  dc: http://purl.org/dc/elements/1.1/#
                  dfc-b: http://static.datafoodconsortium.org/ontologies/DFC_BusinessOntology.owl#
                  dfc-p: http://static.datafoodconsortium.org/ontologies/DFC_ProductOntology.owl#
                  dfc-t: http://static.datafoodconsortium.org/ontologies/DFC_TechnicalOntology.owl#
                  dfc-m: http://static.datafoodconsortium.org/data/measures.rdf#
                  dfc-pt: http://static.datafoodconsortium.org/data/productTypes.rdf#
                  dfc-f: http://static.datafoodconsortium.org/data/facets.rdf#
                  dfc-p:hasUnit:
                    "@type": "@id"
                  dfc-b:hasUnit:
                    "@type": "@id"
                  dfc-b:hasQuantity:
                    "@type": "@id"
                  dfc-p:hasType:
                    "@type": "@id"
                  dfc-b:hasType:
                    "@type": "@id"
                  dfc-b:references:
                    "@type": "@id"
                  dfc-b:referencedBy:
                    "@type": "@id"
                  dfc-b:offeres:
                    "@type": "@id"
                  dfc-b:supplies:
                    "@type": "@id"
                  dfc-b:defines:
                    "@type": "@id"
                  dfc-b:affiliates:
                    "@type": "@id"
                  dfc-b:manages:
                    "@type": "@id"
                  dfc-b:offeredThrough:
                    "@type": "@id"
                  dfc-b:hasBrand:
                    "@type": "@id"
                  dfc-b:hasGeographicalOrigin:
                    "@type": "@id"
                  dfc-b:hasClaim:
                    "@type": "@id"
                  dfc-b:hasAllergenDimension:
                    "@type": "@id"
                  dfc-b:hasNutrimentDimension:
                    "@type": "@id"
                  dfc-b:hasPhysicalDimension:
                    "@type": "@id"
                  dfc:owner:
                    "@type": "@id"
                  dfc-t:hostedBy:
                    "@type": "@id"
                  dfc-t:hasPivot:
                    "@type": "@id"
                  dfc-t:represent:
                    "@type": "@id"
                dfc-b:stockLimitation: '3'
                dfc-b:sku: new-sku

  "/api/dfc/Organizations/{enterprise_id}/customerCategories":
    get:
      summary: Return a list of Customer Categories for an Organization
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CustomerCategory
      responses:
        '404':
          description: not found
        '200':
          description: successful
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              examples:
                test_example:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/Organizations/10000/customerCategories/10005
                      "@type": dfc-b:customerCategory
                      dfc-b:definedBy: http://test.host/api/dfc/Organizations/10000
    post:
      summary: create a new Customer Category for a given Organization
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CustomerCategory
      responses:
        '201':
          description: created
          content:
            application/ld+json:
              schema:
                example:
                  "@id": http://test.host/api/dfc/Organizations/10000/customerCategories/10006
        '400':
          description: bad request
        '401':
          description: unauthorized
      requestBody:
        content:
          application/ld+json:
            schema:
              example:
                "@id": "#"
                dfc-b:definedBy: http://test.host/api/dfc/Organizations/10000

  "/api/dfc/Organizations/{enterprise_id}/customerCategories/{id}":
    get:
      summary: Return a specific Customer Category for an Organization
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CustomerCategory
      responses:
        '200':
          description: successful
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              examples:
                test_example:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/Organizations/10000/customerCategories/10005
                      "@type": dfc-b:customerCategory
                      dfc-b:definedBy: http://test.host/api/dfc/Organizations/10000
    delete:
      summary: remove a Customer Category for a given Organization
      parameters:
      - name: x-dfc-version
        in: header
        required: true
        schema:
          type: string
          example: "2.0.0"
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CustomerCategory
      requestBody:
        content:
          application/ld+json:
            schema:
              example:
                "@id": http://test.host/api/dfc/Organizations/10000/customerCategories/10006
      responses:
        '204':
          description: no content
        '401':
          description: unauthorized

  /api/dfc/Organizations/:
    get:
      tags:
      - Organizations
      summary: Show all Organizations (with pagination)
      parameters:
      - name: before
        in: query
        description: "The cursor returned from a previous request, requesting the\
          \ API return elements before that id."
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: after
        in: query
        description: "The cursor returned from a previous request, requesting the\
          \ API return elements after that id."
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: first
        in: query
        description: Return up to the first x elements in the list
        required: false
        style: form
        explode: true
        schema:
          maximum: 255
          minimum: 1
          type: integer
          format: int32
          example: 25
          default: 25
      - name: last
        in: query
        description: Return up to the last x elements in the list
        required: false
        style: form
        explode: true
        schema:
          maximum: 255
          minimum: 1
          type: integer
          format: int32
          example: 25
          default: 25
responses:
        '200':
          description: successful
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              examples:
                test_example:
                  value:
                    '@context': https://www.datafoodconsortium.org
                    '@graph':
                    - '@id': http://test.host/api/dfc/Organizations/10000
                      '@type': dfc-b:Organization
                    - '@id': http://test.host/api/dfc/Organizations/20000
                      '@type': dfc-b:Organization
                    - '@id': http://test.host/api/dfc/Organizations/30000
                      '@type': dfc-b:Organization

        "404":
          description: not found
  "/api/dfc/Organizations/{id}":
    parameters:
    - name: x-dfc-version
      in: header
      required: true
      schema:
        type: string
        example: "2.0.0"
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show enterprise
      parameters: []
      tags:
      - Organizations
      responses:
        "200":
          description: successful
          headers:
            x-dfc-version:
              description: The DFC version the API relates to
              schema:
                type: string
                example: "2.0.0"
          content:
            application/ld+json:
              examples:
                test_example:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@graph": [
                    {
                      "@id": http://test.host/api/dfc/Organizations/10000 ,
                      "@type": dfc-b:Organization ,
                      dfc-b:hasAddress: http://test.host/api/dfc/Addresses/40000 ,
                      dfc-b:hasPhoneNumber: http://test.host/api/dfc/PhoneNumbers/444000200 ,
                      dfc-b:email: hello@example.org ,
                      dfc-b:websitePage: https://test.host/ ,
                      dfc-b:hasSocialMedia: http://test.host/api/dfc/Organizations/10000/SocialMedias/facebook ,
                      dfc-b:name: Fred's Farm ,
                      dfc-b:hasDescription: This is an awesome enterprise ,
                      dfc-b:VATnumber: 123 456 ,
                      dfc-b:manages: http://test.host/api/dfc/Organizations/10000/CatalogItems/10021 ,
                      dfc-b:supplies: http://test.host/api/dfc/Organizations/10000/SuppliedProduct5/10001 ,
                      dfc-b:supplies: http://test.host/api/dfc/Organizations/10000/SuppliedProducts/10002 ,
                      dfc-b:supplies: http://test.host/api/dfc/Organizations/10000/SuppliedProducts/10005 ,
                      dfc-b:hasMainContact: http://test.host/api/dfc/Persons/10000 ,
                      dfc-b:logo: http://test.host/active-storage/url/logo.png ,
                      dfc-b:affiliates: http://test.host/api/dfc/Organizations/60000 ,
                    },
                    {
                      "@id": http://test.host/api/dfc/Addresses/40000 ,
                      "@type": dfc-b:Address ,
                      dfc-b:hasStreet: 42 Doveton Street ,
                      dfc-b:hasPostalCode: '20170' ,
                      dfc-b:hasCity: Herndon ,
                      dfc-b:hasCountry: USA ,
                      dfc-b:region: Virginia ,
                    },
                    {
                      "@id": http://test.host/api/dfc/Organizations/10000/SuppliedProducts/10001 ,
                      "@type": dfc-b:SuppliedProduct ,
                      dfc-b:name: Apple - 1g ,
                      dfc-b:description: Round ,
                      dfc-b:hasType: dfc-pt:non-local-vegetable ,
                      dfc-b:hasQuantity: {
                        "@type": dfc-b:QuantitativeValue ,
                        dfc-b:hasUnit: dfc-m:Gram ,
                        dfc-b:value: 1.0
                      },
                      dfc-b:alcoholPercentage: 0.0 ,
                      dfc-b:lifetime: '' ,
                      dfc-b:usageOrStorageCondition: '' ,
                      dfc-b:totalTheoreticalStock: 0.0 ,
                      dfc-b:image: http://test.host/active-storage/url/logo-white.png
                    },
                    {
                      "@id": http://test.host/api/dfc/Organizations/10000/CatalogItems/10001 ,
                      "@type": dfc-b:CatalogItem ,
                      dfc-b:references: http://test.host/api/dfc/Organizations/10000/SuppliedProducts/10001 ,
                      dfc-b:sku: APP ,
                      dfc-b:stockLimitation: 5 ,
                      dfc-b:offeredThrough: http://test.host/api/dfc/Organizations/10000/customerCategories/10005/Offers/10001
                    },
                    {
                     "@id": http://test.host/api/dfc/Organizations/10000/SocialMedias/facebook  ,
                      "@type": dfc-b:SocialMedia ,
                      dfc-b:name: facebook ,
                      dfc-b:URL: https://facebook.com/user
                    }
                    ]
        '404':
          description: not found
    'post':
      summary: Create an Organization
      tags:
      - Organizations
      responses:
        '201':
          description: created
        '400':
          description: bad request
        '401':
          description: unauthorized
      requestBody:
        content:
          application/ld+json:
            schema:
              example:
                test_example:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@id": "#"
                    "@type": dfc-b:Organization
                    dfc-b:hasAddress: http://test.host/api/dfc/Addresses/40000
                    dfc-b:hasPhoneNumber: http://test.host/api/dfc/PhoneNumbers/444000200
                    dfc-b:email: hello@example.org
                    dfc-b:websitePage: https://test.host/
                    dfc-b:hasSocialMedia: "#SocialMedias/facebook"
                    dfc-b:name: Fred's Farm
                    dfc-b:hasDescription: This is an awesome enterprise
                    dfc-b:VATnumber: 123 456
                    dfc-b:manages: "#/CatalogItems/10001"
                    dfc-b:supplies: "#/SuppliedProducts/10001"
                    dfc-b:hasMainContact: http://test.host/api/dfc/Persons/10000
                    dfc-b:logo: http://test.host/active-storage/url/logo.png
                    dfc-b:affiliates: http://test.host/api/dfc/Organizations/60000
    'put':
      summary: Update an Organization
      parameters: []
      tags:
      - Organizations
      responses:
        '204':
          description: no content
